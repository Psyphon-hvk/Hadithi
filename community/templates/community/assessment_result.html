{% extends "base.html" %}
{% block title %}Your Result | HADITHI{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-xl border shadow-sm p-8 text-center">
    <h1 class="text-xl font-bold text-hadithi-800 mb-2">{{ result.assessment.name }} Result</h1>
    <p class="text-4xl font-bold text-hadithi-600 my-4">{{ result.score }}</p>
    <p class="text-gray-700">{{ result.recommendation }}</p>
    <a href="{% url 'wellness:journal' %}" class="inline-block mt-6 text-hadithi-600 hover:underline text-sm">Explore the wellness toolkit &rarr;</a>
</div>
{% endblock %}
