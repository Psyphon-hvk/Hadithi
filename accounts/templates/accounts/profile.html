{% extends "base.html" %}
{% block title %}My Profile | HADITHI{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-xl shadow-sm border p-8">
    <h1 class="text-xl font-bold text-hadithi-800 mb-6">My Profile</h1>
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<p class="text-red-600 text-xs mt-1">{{ error }}</p>{% endfor %}
        </div>
        {% endfor %}
        <button type="submit" class="w-full bg-hadithi-600 text-white py-2 rounded-lg hover:bg-hadithi-700">Save Changes</button>
    </form>
</div>
{% endblock %}
