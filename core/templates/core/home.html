<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hadithi — Under Maintenance</title>
<style>
  :root {
    --cream: #fdf1e3;
    --peach: #f6c78b;
    --peach-soft: #fbe3c2;
    --grey-blob: #f2f2f2;
    --ink: #2b2b2b;
    --ink-soft: #6f6f6f;
    --line: #2b2b2b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: var(--cream);
    font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif;
    color: var(--ink);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .frame {
    width: 100%;
    max-width: 760px;
    background: #ffffff;
    border-radius: 10px;
    padding: 56px 40px 64px;
    position: relative;
    box-shadow: 0 30px 60px rgba(80, 50, 20, 0.08);
  }

  .brandbar {
    text-align: center;
    margin-bottom: 8px;
  }

  .brandbar span {
    font-weight: 700;
    letter-spacing: 3px;
    font-size: 13px;
    color: var(--peach);
    text-transform: uppercase;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding-top: 40px;
  }

  /* organic blobs behind illustration */
  .blob-peach {
    position: absolute;
    width: 300px;
    height: 300px;
    right: 0;
    top: 40px;
    background: var(--peach-soft);
    border-radius: 46% 54% 58% 42% / 45% 40% 60% 55%;
    z-index: 0;
  }

  .blob-grey {
    position: absolute;
    width: 340px;
    height: 300px;
    left: 50%;
    top: 10px;
    transform: translateX(-50%);
    background: var(--grey-blob);
    border-radius: 55% 45% 48% 52% / 50% 55% 45% 50%;
    z-index: 1;
  }

  .dot-1 {
    position: absolute;
    width: 26px;
    height: 32px;
    background: var(--peach);
    border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
    top: -6px;
    left: 46%;
    transform: rotate(-10deg);
    z-index: 2;
  }

  .dot-2 {
    position: absolute;
    width: 30px;
    height: 22px;
    background: var(--peach);
    border-radius: 50%;
    bottom: 30px;
    left: 8%;
    transform: rotate(20deg);
    z-index: 2;
  }

  .content {
    position: relative;
    z-index: 3;
    text-align: center;
    padding: 50px 30px 40px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 30px;
    color: var(--ink);
  }

  .illustration {
    width: 260px;
    max-width: 80%;
    margin: 0 auto 26px;
    display: block;
  }

  p.sub {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0;
  }

  .cta-wrap {
    text-align: center;
    margin-top: 36px;
  }

  .btn {
    background: var(--peach);
    color: #3a2410;
    border: none;
    padding: 13px 30px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }

  .btn:hover {
    background: #f0b56e;
    transform: translateY(-1px);
  }

  .details {
    max-width: 460px;
    margin: 0 auto;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.4s ease, opacity 0.4s ease, margin-top 0.4s ease;
  }

  .details.open {
    max-height: 200px;
    opacity: 1;
    margin-top: 24px;
  }

  .details p {
    background: var(--peach-soft);
    border-left: 3px solid var(--peach);
    border-radius: 6px;
    padding: 16px 20px;
    margin: 0;
    font-size: 13.5px;
    line-height: 1.7;
    color: #5a4326;
    text-align: left;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 12px;
    color: #b9b0a4;
  }

  @media (max-width: 480px) {
    .frame { padding: 40px 20px 48px; }
    h1 { font-size: 19px; }
    .blob-peach, .blob-grey { width: 240px; height: 240px; }
  }
</style>
</head>
<body>

  <div class="frame">
    <div class="brandbar"><span>Hadithi</span></div>

    <div class="stage">
      <div class="blob-peach"></div>
      <div class="blob-grey"></div>
      <div class="dot-1"></div>
      <div class="dot-2"></div>

      <div class="content">
        <h1>Hadithi is under maintenance</h1>

        <svg class="illustration" viewBox="0 0 300 140" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- left cable -->
          <path d="M10 60 C 40 40, 55 90, 90 75 C 110 66, 100 100, 118 100" stroke="var(--line)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <!-- left plug body -->
          <rect x="118" y="86" width="36" height="30" rx="6" transform="rotate(-8 118 86)" stroke="var(--line)" stroke-width="2.5" fill="#fff"/>
          <rect x="126" y="94" width="16" height="14" rx="2" transform="rotate(-8 126 94)" fill="var(--peach)"/>

          <!-- right cable -->
          <path d="M290 30 C 260 20, 250 55, 220 48 C 205 45, 210 68, 190 66" stroke="var(--line)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <!-- right plug body -->
          <rect x="160" y="52" width="38" height="30" rx="6" transform="rotate(8 160 52)" stroke="var(--line)" stroke-width="2.5" fill="#fff"/>
          <rect x="168" y="60" width="16" height="14" rx="2" transform="rotate(8 168 60)" fill="var(--peach)"/>
          <!-- prongs -->
          <line x1="182" y1="50" x2="178" y2="36" stroke="var(--line)" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="192" y1="53" x2="190" y2="39" stroke="var(--line)" stroke-width="2.5" stroke-linecap="round"/>

          <!-- spark / gap indicator -->
          <circle cx="160" cy="84" r="2.5" fill="var(--peach)"/>
          <circle cx="168" cy="90" r="2" fill="var(--peach)"/>
        </svg>

        <p class="sub">We're preparing to serve you better. We shall resume shortly.</p>

        <div class="cta-wrap">
          <button class="btn" id="learnMoreBtn" onclick="toggleDetails()">Learn More</button>
        </div>

        <div class="details" id="detailsBox">
          <p>Based on the meeting held, some corrections are needed for this site. We shall resume shortly.</p>
        </div>
      </div>
    </div>

    <footer>&copy; <span id="year"></span> Hadithi. All rights reserved.</footer>
  </div>

  <script>
    function toggleDetails() {
      const box = document.getElementById('detailsBox');
      const btn = document.getElementById('learnMoreBtn');
      const isOpen = box.classList.toggle('open');
      btn.textContent = isOpen ? 'Show Less' : 'Learn More';
    }
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
